services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: educore_slices
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: local-only-change-me
    ports: ["127.0.0.1:5434:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d educore_slices"]
      interval: 2s
      timeout: 2s
      retries: 30
